# Reusable steps: install, run, publish. Used by every stage in azure-pipelines.yml.
parameters:
  - name: grep
    type: string
    default: ''

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install --with-deps chromium
    displayName: Install browser

  - script: |
      if [ -n "${{ parameters.grep }}" ]; then
        npx playwright test --grep "${{ parameters.grep }}"
      else
        npx playwright test
      fi
    displayName: Run Playwright tests
    env:
      CI: 'true'
      BASE_URL: $(BASE_URL)

  # condition: always() = publish results even when tests fail.
  - task: PublishTestResults@2
    displayName: Publish test results (shows in the Tests tab)
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: results/junit.xml
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    displayName: Publish HTML report and traces
    condition: always()
    inputs:
      targetPath: playwright-report
      artifact: playwright-report-$(System.JobAttempt)
